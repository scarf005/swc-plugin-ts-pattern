name: Benchmark

on:
  push:
    paths:
      - .github/workflows/bench.yml
      - examples/**
      - justfile
      - plugin/Cargo.lock
      - plugin/Cargo.toml
      - rust-toolchain.toml
      - plugin/package-lock.json
      - plugin/src/**
      - web/package-lock.json
      - web/src/**
      - web/ts-pattern.bench.ts
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            plugin/package-lock.json
            web/package-lock.json

      - name: Install Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install

      - uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: just

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            plugin/target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'plugin/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - run: npm ci
        working-directory: plugin

      - run: npm run build
        working-directory: plugin

      - run: just bench-file
        env: { BENCH_JSON: "${{ runner.temp }}/bench.json" }

      - run: |
          {
            echo '```text'
            cat docs/just-bench.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark
          path: docs/just-bench.txt

      - name: Commit the table to the bench branch
        if: github.event_name != 'push'
        run: |
          git fetch --depth=1 origin bench && git worktree add bench-out FETCH_HEAD || git worktree add --orphan -b bench bench-out
          node scripts/bench-svg.mts "$RUNNER_TEMP/bench.json" bench-out/bench.svg "ops/s, higher is better. $(date -u +%F), ${GITHUB_SHA::7}"
          cd bench-out
          git add bench.svg
          git -c user.name="github-actions[bot]" -c user.email="41898283+github-actions[bot]@users.noreply.github.com" commit -m "chore: update benchmark table for ${GITHUB_SHA::7}"
          git push origin HEAD:bench
          curl -fsS "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@bench/bench.svg"
