name: Benchmark

on:
  push:
    paths:
      - .github/workflows/bench.yml
      - examples/**
      - justfile
      - plugin/Cargo.lock
      - plugin/Cargo.toml
      - rust-toolchain.toml
      - plugin/package-lock.json
      - plugin/src/**
      - web/deno.lock
      - web/src/**
      - web/ts-pattern_bench.ts
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: plugin/package-lock.json

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.7
          cache: true

      - name: Install Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install

      - uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: just

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            plugin/target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'plugin/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - run: npm ci
        working-directory: plugin

      - run: npm run build
        working-directory: plugin

      - run: just bench-file

      - run: |
          {
            echo '```text'
            cat docs/just-bench.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark
          path: docs/just-bench.txt
