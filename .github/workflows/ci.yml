name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: npm
          cache-dependency-path: |
            plugin/package-lock.json
            demo/package-lock.json

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.7
          cache: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
          components: rustfmt, clippy

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            plugin/target
          key: cargo-${{ runner.os }}-${{ hashFiles('plugin/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - run: cargo fmt --manifest-path plugin/Cargo.toml -- --check

      - run: cargo clippy --manifest-path plugin/Cargo.toml --all-targets -- -D warnings

      - run: npm ci
        working-directory: plugin

      - run: cargo test --manifest-path plugin/Cargo.toml

      - run: npm run build
        working-directory: plugin

      - run: npm run test:runtime
        working-directory: plugin

      - run: npm pack --dry-run --ignore-scripts
        working-directory: plugin

      - run: npm ci
        working-directory: demo

      - run: npx playwright install --with-deps chromium
        working-directory: demo

      - run: npm run build
        working-directory: demo

      - run: npm run lint
        working-directory: demo

      - run: npm run test:browser
        working-directory: demo

      - name: Install web browser
        working-directory: web
        run: deno run -A playwright install --with-deps chromium

      - name: Web browser regressions
        working-directory: web
        run: deno task test:browser
