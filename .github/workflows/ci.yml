name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Test
    # Playwright 1.60 cannot install Chromium dependencies on ubuntu 26.04.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { submodules: recursive }

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            plugin/package-lock.json
            web/package-lock.json
            examples/package-lock.json
            demo/package-lock.json
            vendor/ts-pattern/package-lock.json

      # Runs the plugin Deno runtime tests; they skip without deno.
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.7
          cache: true

      - name: Install Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/cargo-audit
            ~/.cargo/registry
            ~/.cargo/git
            plugin/target
          key: cargo-ubuntu-24.04-${{ hashFiles('rust-toolchain.toml', 'plugin/Cargo.lock') }}
          restore-keys: |
            cargo-ubuntu-24.04-

      - run: npm ci

      - run: npm run lint

      - run: npm run fmt -- --check

      - run: cargo fmt --manifest-path plugin/Cargo.toml -- --check

      - run: cargo clippy --locked --manifest-path plugin/Cargo.toml --all-targets -- -D warnings

      - name: Check Rust dependencies for RustSec advisories
        # The cache keeps the binary, so install again only when the version differs.
        run: |
          version=0.22.0
          case "$(cargo audit --version 2>/dev/null)" in
            *" $version") ;;
            *) cargo install cargo-audit --locked --force --version "$version" ;;
          esac
          cargo audit --file plugin/Cargo.lock

      - run: npm ci
        working-directory: plugin

      - run: npm test
        working-directory: plugin

      - run: npm pack --dry-run --ignore-scripts
        working-directory: plugin

      - run: npm ci
        working-directory: web

      - run: npm run check
        working-directory: web

      - run: npm test
        working-directory: web

      - run: npm run build
        working-directory: web

      - run: npx playwright install --with-deps chromium
        working-directory: web

      - run: npm run test:browser
        working-directory: web

      - run: npm ci
        working-directory: demo

      - run: npx playwright install --with-deps chromium
        working-directory: demo

      - run: npm run build
        working-directory: demo

      - run: npm run lint
        working-directory: demo

      - run: npm run test:browser
        working-directory: demo

      - run: npm ci
        working-directory: examples

      - run: npm run check
        working-directory: examples

      - run: npm ci
        working-directory: vendor/ts-pattern

      - run: node scripts/check-vendored-ts-pattern-swc.mts

      - run: npm test
        working-directory: vendor/ts-pattern

  # The oldest supported Node.js, and the first 24.x and 26.x that resolve imports in CommonJS files.
  node:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [22.15.0, 24.18.0, 26.2.0]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: plugin/package-lock.json

      - name: Install Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/cargo-audit
            ~/.cargo/registry
            ~/.cargo/git
            plugin/target
          key: cargo-ubuntu-24.04-${{ hashFiles('rust-toolchain.toml', 'plugin/Cargo.lock') }}
          restore-keys: |
            cargo-ubuntu-24.04-

      - run: npm ci
        working-directory: plugin

      - run: npm run build
        working-directory: plugin

      - run: npm run test:runtime
        working-directory: plugin
