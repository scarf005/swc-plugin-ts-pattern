name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { submodules: recursive }

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            plugin/package-lock.json
            web/package-lock.json
            examples/package-lock.json
            demo/package-lock.json
            vendor/ts-pattern/package-lock.json

      # Runs the plugin Deno runtime tests; they skip without deno.
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.7
          cache: true

      - name: Install Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            plugin/target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'plugin/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - run: npm ci

      - run: npm run lint

      - run: npm run fmt -- --check

      - run: cargo fmt --manifest-path plugin/Cargo.toml -- --check

      - run: cargo clippy --locked --manifest-path plugin/Cargo.toml --all-targets -- -D warnings

      - run: npm ci
        working-directory: plugin

      - run: npm test
        working-directory: plugin

      - run: npm pack --dry-run --ignore-scripts
        working-directory: plugin

      - run: npm ci
        working-directory: web

      - run: npm run check
        working-directory: web

      - run: npm test
        working-directory: web

      - run: npm run build
        working-directory: web

      - run: npx playwright install --with-deps chromium
        working-directory: web

      - run: npm run test:browser
        working-directory: web

      - run: npm ci
        working-directory: demo

      - run: npx playwright install --with-deps chromium
        working-directory: demo

      - run: npm run build
        working-directory: demo

      - run: npm run lint
        working-directory: demo

      - run: npm run test:browser
        working-directory: demo

      - run: npm ci
        working-directory: examples

      - run: npm run check
        working-directory: examples

      - run: npm ci
        working-directory: vendor/ts-pattern

      - run: node scripts/check-vendored-ts-pattern-swc.mts

      - run: npm test
        working-directory: vendor/ts-pattern
